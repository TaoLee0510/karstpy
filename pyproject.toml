[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "karstpy"
version = "1.1.3"
description = "Karyotype abundance-based reconstruction of fitness landscapes from sparse time points"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = ["LICENSE", "LICENSE-karst", "third_party/eigen/COPYRIGHTS"]
authors = [
    { name = "Richard Beck" },
    { name = "Tao Li" },
]
dependencies = ["numpy", "scipy", "pandas"]

[project.optional-dependencies]
alfak = ["rdata>=1.0; python_version >= '3.11'"]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/karstpy"]
sdist.exclude = ["_reference/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
