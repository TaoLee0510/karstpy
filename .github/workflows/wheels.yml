name: Build wheels

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS: native
          CIBW_TEST_EXTRAS: test,alfak
          CIBW_TEST_COMMAND: python -m pytest -q {project}/tests
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=15.0"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
      - name: Verify macOS wheel deployment target
        if: runner.os == 'macOS'
        run: python3 .github/scripts/check_macos_wheels.py wheelhouse "$RUNNER_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
